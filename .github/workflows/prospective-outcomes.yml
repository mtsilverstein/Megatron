name: prospective outcomes
# Season-end outcome artifact for the roster-sim v2 prospective test (spec 2026-09-30 §7.6; final review I5).
# Builds models/prospective/2026/outcomes_2026.json from a FRESH nflverse pull on or after 2027-01-12, with the
# FROZEN builder: the code runs from the `prospective-2026-o5` tag's tree and its environment is that tag's recorded pip
# freeze. Never overwrites an existing artifact; refuses (non-zero) while any REG game of weeks 5-17 lacks stats or a
# final score, so a partial season can never be committed. Run it again (manually) if it refuses.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 12 1 *"   # 15:00 UTC on 12 January
env:
  SEASON: "2026"
  AS_OF: "2027-01-12"
concurrency:
  group: prospective-outcomes
  cancel-in-progress: false
jobs:
  outcomes:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - name: Refuse to run from any ref except main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "runs only from refs/heads/main (got $GITHUB_REF)" >&2; exit 1; fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Date and existence guard
        id: guard
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          OUT="models/prospective/$SEASON/outcomes_$SEASON.json"
          if [[ "$TODAY" < "$AS_OF" ]]; then
            echo "today $TODAY is before $AS_OF; outcomes are never built early" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -e "$OUT" ]; then
            echo "$OUT already exists; never overwritten" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git rev-parse --verify --quiet "refs/tags/prospective-$SEASON-o5^{commit}" >/dev/null || { echo "tag prospective-$SEASON-o5 not found" >&2; exit 1; }
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        if: steps.guard.outputs.run == 'true'
        with: { python-version: "3.12.10" }
      - name: Build from the origin-5 tag's tree and environment
        if: steps.guard.outputs.run == 'true'
        run: |
          git checkout --detach "refs/tags/prospective-$SEASON-o5"
          pip install -r "models/prospective/$SEASON/o5/inputs/pip_freeze.txt"
          pip install -e . --no-deps
          python -m ffmodel.prospective.outcomes --season "$SEASON" --as-of "$AS_OF" --out "${{ steps.guard.outputs.out }}"
      - name: Commit onto main (never force; up to 3 attempts)
        if: steps.guard.outputs.run == 'true'
        env:
          OUT: ${{ steps.guard.outputs.out }}
        run: |
          git config user.name "prospective-outcomes-bot"
          git config user.email "actions@users.noreply.github.com"
          for ATTEMPT in 1 2 3; do
            git fetch origin main
            git checkout -q -B main origin/main
            if [ -e "$OUT" ] && git ls-files --error-unmatch "$OUT" >/dev/null 2>&1; then echo "$OUT appeared on main meanwhile; not overwriting" >&2; exit 1; fi
            git add "$OUT"
            git commit -q -m "data: prospective outcomes $SEASON as of $AS_OF"
            if git push origin HEAD:main; then exit 0; fi
            git reset -q --soft HEAD~1
            git reset -q
            sleep 5
          done
          echo "push failed 3 times" >&2
          exit 1
