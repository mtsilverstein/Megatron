name: weekly site update
on:
  schedule:
    - cron: "23 5,17 * 9-12,1 *"   # Twice daily; keep 72-hour consumers fresh
  workflow_dispatch:
    inputs:
      draft:
        description: "regenerate the draft board instead of the weekly slate (works preseason)"
        type: boolean
        default: false
env:
  MODEL: transformer
  # comma-separated run roots = the deployed 3-seed ensemble; the predictor
  # appends through{year} to each and averages the quantiles
  ARTIFACT_ROOT: "models/transformer/v1,models/transformer/v1_s43,models/transformer/v1_s44"
  SEASON: "2026"
concurrency:
  group: weekly-site-refresh
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -e .
      - name: Generate site JSON (fail-safe - any error stops the job, site keeps last data)
        id: batch
        run: |
          set -e
          if [ "${{ inputs.draft }}" = "true" ]; then
            ARGS="--out site/data --model $MODEL --season $SEASON --draft"
            if [ -n "$ARTIFACT_ROOT" ]; then ARGS="$ARGS --artifact-root $ARTIFACT_ROOT"; fi
            for LEAGUE in fam gabagool; do
              python -m ffmodel.site.generate $ARGS --league "$LEAGUE"
            done
          else
            # One process writes the legacy per-league files AND the neutral
            # batch into an empty stage (manifest last); publish validates the
            # whole stage before copying. Any nonzero exit fails the job before
            # the commit step, which is the all-or-nothing boundary.
            STAGE="$RUNNER_TEMP/stage"; rm -rf "$STAGE"; mkdir -p "$STAGE"
            # Exit 10 = season complete, 11 = completed games' stats not posted yet: clean
            # states, nothing staged, nothing published. Any other nonzero exit fails the job.
            set +e
            python -m ffmodel.site.batch --out "$STAGE" --model "$MODEL" --season "$SEASON" --week auto --leagues gabagool,fam --artifact-root "$ARTIFACT_ROOT"
            RC=$?
            set -e
            if [ "$RC" -eq 0 ]; then
              python -m ffmodel.site.publish --stage "$STAGE" --out site/data
              echo "state=published" >> "$GITHUB_OUTPUT"
            elif [ "$RC" -eq 10 ]; then
              echo "state=season_over" >> "$GITHUB_OUTPUT"
              echo "::notice::Season complete: no slate published; the live accuracy summary still refreshes."
              echo "- Season complete: no slate published; the live accuracy summary still refreshes." >> "$GITHUB_STEP_SUMMARY"
            elif [ "$RC" -eq 11 ]; then
              echo "state=stats_pending" >> "$GITHUB_OUTPUT"
              echo "::notice::Stats for completed games are not posted yet: no slate published this run; the next run retries."
              echo "- Stats for completed games are not posted yet: no slate published this run; the next run retries." >> "$GITHUB_STEP_SUMMARY"
            else
              exit "$RC"
            fi
          fi
      - name: Refresh optional free weekly ECR (never external FPTS)
        id: live_experts
        if: inputs.draft != true && steps.batch.outputs.state == 'published'
        continue-on-error: true
        run: python -m ffmodel.site.live_experts
      - name: Refresh optional free ROS consensus (separate from weekly)
        id: ros_experts
        if: inputs.draft != true && steps.batch.outputs.state == 'published'
        continue-on-error: true
        run: python -m ffmodel.site.ros_experts
      - name: Refresh the live accuracy summary (a checked copy of the committed weekly scorecard)
        id: live_accuracy
        if: inputs.draft != true
        continue-on-error: true
        run: python -m ffmodel.site.live_accuracy_site --season "$SEASON"
      - name: Surface optional refresh failures
        if: inputs.draft != true
        run: |
          if [ "${{ steps.live_experts.outcome }}" = "failure" ]; then
            echo "::warning::Weekly ECR refresh (live_experts) failed; site/data/weekly-ecr.json is stale"
            echo "- Weekly ECR refresh (live_experts) failed; \`site/data/weekly-ecr.json\` is stale" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.ros_experts.outcome }}" = "failure" ]; then
            echo "::warning::ROS consensus refresh (ros_experts) failed; site/data/ros-ecr.json is stale"
            echo "- ROS consensus refresh (ros_experts) failed; \`site/data/ros-ecr.json\` is stale" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.live_accuracy.outcome }}" = "failure" ]; then
            echo "::warning::Live accuracy summary (live_accuracy_site) failed; site/data/live-accuracy.json is stale"
            echo "- Live accuracy summary (live_accuracy_site) failed; \`site/data/live-accuracy.json\` is stale" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit refreshed data
        id: commit
        env:
          BOT_TOKEN: ${{ github.token }}
          # The branch this run was started from (main for every scheduled run). A manual dispatch from a branch
          # pushes back to that branch, as the old plain `git push` did -- never onto main.
          BRANCH: ${{ github.ref_name }}
        run: |
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$BOT_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          gitp() { git -c "http.https://github.com/.extraheader=$AUTH" "$@"; }
          git config user.name "weekly-update-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          if [ -d data_snapshots/weekly_ecr ]; then git add data_snapshots/weekly_ecr; fi
          if [ -d data_snapshots/ros_ecr ]; then git add data_snapshots/ros_ecr; fi
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "data: weekly site refresh"
          for i in 1 2 3; do
            gitp pull --rebase origin "$BRANCH" && gitp push origin "HEAD:$BRANCH" && echo "pushed=true" >> "$GITHUB_OUTPUT" && exit 0
            git rebase --abort 2>/dev/null || true   # a failed rebase must not poison the next attempt
          done
          exit 1
      # Hosting is Vercel (Git integration): the data push above triggers the deploy.
