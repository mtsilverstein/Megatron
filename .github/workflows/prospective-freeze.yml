name: prospective freeze
# Remote witness for the roster-sim v2 prospective test (spec 2026-09-30 §7.2). Manual only, main only. Timing
# evidence: the Actions run record, the atomically pushed commit+tag, and (permanent, server-set created_at) a GitHub
# Release for the tag carrying the manifest and a tarball of the freeze directory.
#
# Origin 9 (the input refresh) is built from the `prospective-2026-o5` TAG'S TREE, not from main's: the code that runs
# is then byte-for-byte the origin-5 code, whatever landed on main since. The new o9/ directory is written there, the
# checkout then moves to main's tip, and only o9/ is committed onto it. The Python environment is installed from o5's
# recorded pip freeze, and Node/Python are pinned to exact releases; origin 9 refuses (exit 5) if any of it differs.
on:
  workflow_dispatch:
    inputs:
      origin:
        description: "origin week (real runs: 5 = the freeze, 9 = input refresh; dry run: any, e.g. 4 = the rehearsal)"
        type: string
        default: "5"
      dry_run:
        description: "rehearsal: writes dryrun-o<origin>/, pushes the commit only (no tag/release), cutoff reported not enforced"
        type: boolean
        default: false
      contingency_origin9_only:
        description: "spec 7.5 ONLY: origin-5 freeze was missed; freeze origin 9 fresh, marked exploratory (real origin 9 only)"
        type: boolean
        default: false
env:
  SEASON: "2026"
concurrency:
  group: prospective-freeze
  cancel-in-progress: false
jobs:
  freeze:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - name: Refuse to run from any ref except main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "prospective freeze runs only from refs/heads/main (got $GITHUB_REF)" >&2; exit 1; fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      # Exact toolchain pins (origin 9 must run on the same Node and Python as origin 5; both versions are recorded in
      # the manifest and compared). Do not float these.
      - uses: actions/setup-python@v6
        with: { python-version: "3.12.10" }
      - uses: actions/setup-node@v4
        with: { node-version: "24.12.0" }
      - name: Resolve target
        id: target
        env:
          IN_ORIGIN: ${{ inputs.origin }}
          IN_DRY: ${{ inputs.dry_run }}
          IN_CONT: ${{ inputs.contingency_origin9_only }}
        run: |
          case "$IN_ORIGIN" in ''|*[!0-9]*) echo "origin must be an integer" >&2; exit 1;; esac
          ORIGIN=$((10#$IN_ORIGIN))
          FROM_TAG=false
          if [ "$IN_DRY" = "true" ]; then
            DIR="models/prospective/$SEASON/dryrun-o$ORIGIN"
            if [ "$IN_CONT" = "true" ]; then echo "contingency mode is for a real run only" >&2; exit 1; fi
          else
            case "$ORIGIN" in 5|9) ;; *) echo "real runs are origin 5 or 9 only" >&2; exit 1;; esac
            DIR="models/prospective/$SEASON/o$ORIGIN"
            if [ "$IN_CONT" = "true" ] && [ "$ORIGIN" != "9" ]; then echo "contingency mode is origin 9 only" >&2; exit 1; fi
            if git ls-remote --exit-code --tags origin "refs/tags/prospective-$SEASON-o$ORIGIN" >/dev/null 2>&1; then
              echo "tag prospective-$SEASON-o$ORIGIN already exists" >&2; exit 1
            fi
            if [ "$ORIGIN" = "9" ] && [ "$IN_CONT" != "true" ]; then FROM_TAG=true; fi
          fi
          if [ -e "$DIR" ]; then echo "$DIR already exists in the repo; freezes are never overwritten" >&2; exit 1; fi
          echo "origin=$ORIGIN" >> "$GITHUB_OUTPUT"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "from_tag=$FROM_TAG" >> "$GITHUB_OUTPUT"
      - name: Origin 9 only - switch the working tree to the origin-5 tag (the code that runs is o5's, by construction)
        if: steps.target.outputs.from_tag == 'true'
        run: |
          TAG="prospective-$SEASON-o5"
          git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" >/dev/null || { echo "tag $TAG not found: no origin-5 freeze (use the contingency option only if o5 was missed)" >&2; exit 1; }
          git checkout --detach "refs/tags/$TAG"
          test -f "models/prospective/$SEASON/o5/manifest.json"
          test -f "models/prospective/$SEASON/o5/inputs/pip_freeze.txt"
          echo "building from $(git rev-parse HEAD) (tag $TAG)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install (origin 9 installs o5's recorded pip freeze, then the project without re-resolving)
        env:
          FROM_TAG: ${{ steps.target.outputs.from_tag }}
        run: |
          if [ "$FROM_TAG" = "true" ]; then
            pip install -r "models/prospective/$SEASON/o5/inputs/pip_freeze.txt"
            pip install -e . --no-deps
          else
            pip install -e .
          fi
      - name: Build the freeze (fails closed at/after cutoff, on stale data, or on any input drift)
        id: freeze
        env:
          ORIGIN: ${{ steps.target.outputs.origin }}
          IN_DRY: ${{ inputs.dry_run }}
          IN_CONT: ${{ inputs.contingency_origin9_only }}
        run: |
          ARGS="--season $SEASON --origin $ORIGIN"
          if [ "$IN_DRY" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "$IN_CONT" = "true" ]; then ARGS="$ARGS --contingency-origin9-only"; fi
          set -o pipefail
          python -m ffmodel.prospective.freeze $ARGS | tee freeze.log
          SHA=$(grep '^MANIFEST_SHA256=' freeze.log | cut -d= -f2)
          test -n "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "MANIFEST_SHA256=$SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: prospective-freeze-${{ steps.target.outputs.origin }}${{ inputs.dry_run && '-dryrun' || '' }}
          path: ${{ steps.target.outputs.dir }}
          retention-days: 90
      - name: Commit, re-check cutoff, push commit + tag atomically (never force; up to 3 attempts)
        env:
          DIR: ${{ steps.target.outputs.dir }}
          ORIGIN: ${{ steps.target.outputs.origin }}
          SHA: ${{ steps.freeze.outputs.sha }}
          IN_DRY: ${{ inputs.dry_run }}
          FROM_TAG: ${{ steps.target.outputs.from_tag }}
        run: |
          BUILD_HEAD=$(git rev-parse HEAD)
          git config user.name "prospective-freeze-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ "$IN_DRY" = "true" ]; then KIND=" (DRY RUN)"; else KIND=""; fi
          EXPL=$(python -c "import json,sys; m=json.load(open(sys.argv[1]+'/manifest.json')); print(' [EXPLORATORY: '+m['reason']+']' if m.get('exploratory') else '')" "$DIR")
          MSG="data: prospective freeze $SEASON origin $ORIGIN$KIND$EXPL (manifest $SHA)"
          if [ "$IN_DRY" = "true" ]; then
            git checkout -q -B main origin/main   # the untracked freeze directory survives the checkout
            git add "$DIR"
            git commit -m "$MSG"
            git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }
            exit 0
          fi
          TAG="prospective-$SEASON-o$ORIGIN"
          for ATTEMPT in 1 2 3; do
            # land the new directory on main's current tip (origin 9 was built on the o5 tag's tree; origin 5 on main)
            git fetch origin main
            git checkout -q -B main origin/main
            if [ "$FROM_TAG" != "true" ]; then
              # origin 5 was built from the checkout commit: everything the manifest hashed must be unchanged on the
              # tip it lands on, or the frozen hashes would not describe the tagged tree
              if ! git diff --quiet "$BUILD_HEAD" HEAD -- src tools site/assets configs models/transformer pyproject.toml                    docs/superpowers/specs data_snapshots "models/prospective/$SEASON/rho.json"                    "models/prospective/$SEASON/format_payloads.json" "models/prospective/$SEASON/world_${SEASON}_*.json"                    site/data/availability.json; then
                echo "REFUSED: main moved under frozen inputs/code since the build started ($BUILD_HEAD -> $(git rev-parse HEAD)); re-run" >&2
                git reset -q --hard "$BUILD_HEAD"; exit 1
              fi
            fi
            git add "$DIR"
            git commit -q -m "$MSG"
            # re-check the cutoff right before pushing
            python - "$DIR/manifest.json" <<'PY'
          import datetime as dt, json, sys
          m = json.load(open(sys.argv[1]))
          cut = dt.datetime.fromisoformat(m["cutoff_utc"])
          now = dt.datetime.now(dt.timezone.utc)
          if now >= cut:
              sys.exit(f"REFUSED: {now.isoformat()} is at/after cutoff {cut.isoformat()}; nothing pushed")
          PY
            git tag "$TAG"
            if git push --atomic origin HEAD:main "refs/tags/$TAG"; then
              echo "pushed on attempt $ATTEMPT" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "push attempt $ATTEMPT failed (main moved?); retrying" >&2
            git tag -d "$TAG"
            git reset -q --soft HEAD~1
            git reset -q            # the freeze directory is untracked again
            sleep 5
          done
          echo "push failed 3 times; this run's uploaded artifact is NOT the freeze (nothing was published)" | tee -a "$GITHUB_STEP_SUMMARY" >&2
          exit 1
      - name: GitHub Release (permanent timing evidence; real runs only)
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIR: ${{ steps.target.outputs.dir }}
          ORIGIN: ${{ steps.target.outputs.origin }}
          SHA: ${{ steps.freeze.outputs.sha }}
        run: |
          TAG="prospective-$SEASON-o$ORIGIN"
          tar -czf "freeze-$SEASON-o$ORIGIN.tar.gz" "$DIR"
          NOTES=$(python -c "import json,sys; m=json.load(open(sys.argv[1]+'/manifest.json')); print('MANIFEST_SHA256=%s\ncutoff_utc=%s\nbuilt_at=%s\nrun=%s' % (sys.argv[2], m['cutoff_utc'], m['built_at'], sys.argv[3]))" "$DIR" "$SHA" "$GITHUB_RUN_ID")
          if ! gh release create "$TAG" --verify-tag --title "$TAG" --notes "$NOTES" "$DIR/manifest.json" "freeze-$SEASON-o$ORIGIN.tar.gz"; then
            echo "::error::The commit and tag $TAG were ALREADY PUSHED (atomic push succeeded) but the GitHub Release FAILED. Do not re-run this workflow (the tag exists); create the release manually with gh release create $TAG, attaching $DIR/manifest.json and a tar.gz of $DIR." >&2
            exit 1
          fi
