# Players returning from a season-ending injury.
#
# WHY THIS FILE IS HAND-MAINTAINED. The model has no injury signal, by design
# (v1 scope guard). It is worse than that: sequences are built from games
# PLAYED, so a missed season leaves no rows and the absence is structurally
# invisible -- `rest_days` is the team's schedule gap, not the player's. And
# the season bands sample games-played from a cohort keyed on position and
# prior production, so a torn ACL inherits a healthy player's availability.
# Expert consensus (ECR) does know, and it sets the board's ORDER, so the
# RANKING is already injury-aware. The BAND is not. This file fixes the band.
#
# WHAT NAMING A PLAYER DOES. His season p10/p50/p90 are simulated from the
# measured returning-player games distribution (`eval.diagnose.returning_table`)
# instead of his healthy position cohort: 9.4 expected games against 13.6 for a
# healthy WR, and P(<=8 games) 0.41 against 0.13. It does NOT move him on the
# board -- ECR sets that, and the experts have already discounted him.
#
# WHO BELONGS HERE. Players who missed most of last season to injury and are
# expected back. NOT: players with a minor knock, players who were benched or
# lost their job, or anyone whose season ended for non-injury reasons. The
# measured distribution was fitted on players who were still PRODUCTIVE PER
# GAME in the season they lost, so it describes was-good-then-got-hurt. Using
# it for a declining veteran applies the wrong curve.
#
# Names must match the board exactly (the same string the draft board shows).
# An unmatched name is a loud failure at board build, never a silent skip.

season: 2026

players:
  # 2025: 4 games (weeks 1-4), then a torn ACL. 2024 was a genuine WR1 rookie
  # season -- 170 targets, 1204 yards -- which is exactly what the model is
  # projecting off, and exactly why his floor needed this.
  - Malik Nabers

  # Added 2026-08-25 after auditing the 2025 season for players who lost most
  # of it to injury while still producing per game -- the exact population the
  # returning-player availability curve was fitted on. Found by query, then
  # each one's REASON confirmed from reporting, because games-played alone
  # cannot tell an injury from a benching or a suspension.

  # Knee sprain from Nov 13; the Jets shut him down for the year once they
  # were out of contention. 7 games, 14.2 ppg (14.7 the year before) -- the
  # per-game form is intact, only the availability was lost.
  - Garrett Wilson

  # Turf-toe surgery on the left foot, no return timeline given at the time.
  # 8 games at 16.8 ppg.
  - Joe Burrow

  # Knee in Week 3, elbow in Week 16, IR. 7 games at 16.0 ppg against 20.6
  # across a full 2024.
  - Jayden Daniels

  # Week 8: fractured leg, dislocated ankle, ruptured deltoid ligament, then
  # surgery. Was RB7 in fantasy points per game over his last six healthy
  # appearances, which is why the healthy-cohort band flatters him so badly.
  - Cam Skattebo

  # Torn ACL in Week 9. 32-489-6 in the eight games before it, i.e. a genuine
  # TE1 pace; the ACL is exactly the injury this curve was built from.
  - Tucker Kraft

  # Back injury, IR. 9 games, and efficiency-wise his best season (career highs
  # in yards per target, per reception, per route run) -- productive-then-hurt,
  # not declining.
  - Sam LaPorta
