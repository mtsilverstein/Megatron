# LAMBDA-SELECTION run, NOT part of the 9-fold mean-head main arm. This is
# one of four candidate configs (spec 2026-07-26 section 3) used ONLY to
# pick mean_lambda on the through2016 fold, by validation-season PPR MAE
# from the Arm-A point estimate (see src/ffmodel/model/select_lambda.py).
# The winner is then hand-frozen into every configs/transformer_mh_through*
# .yaml before the main arm launches. Uses run_name mh_l30 (distinct from
# the shared "mh" run_name the nine main-arm configs use) so this run's
# artifacts land at models/transformer/mh_l30/through2016 instead of
# colliding with -- and deleting -- a sibling candidate's artifact.
run_name: mh_l30
seed: 42
seq_len: 16
val_season: 2016
first_season: 2012
quantiles: [0.1, 0.5, 0.9]
predict_mean: true
# PLACEHOLDER until the lambda-selection runs finish. Spec section 3 fixes
# lambda by validation-season PPR MAE on the through2016 fold (candidates
# 0.1/0.3/1.0/3.0, seed 42) and then FREEZES it for every fold and seed. Update
# all nine files to the selected value before launching the main arm.
mean_lambda: 3.0
model:
  d_model: 96
  n_heads: 4
  n_layers: 3
  dropout: 0.1
train:
  batch_size: 256
  lr: 1.0e-3
  weight_decay: 0.01
  epochs: 60
  patience: 8
  grad_clip: 1.0
  amp: true
out_root: models/transformer
checkpoint_root: models/checkpoints
